[project]
name = "leadhunter"
version = "0.1.0"
description = "Telegram-бот, который ищет лидов на сайты, ИИ-автоматизацию и ИИ-мультики по чатам, картам, биржам и соцсетям"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
    "telethon>=1.36",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pydantic-settings>=2.7",
    "ddgs>=9.0",
    "curl_cffi>=0.10",
    "patchright>=1.50",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-aiohttp>=1.0"]

[tool.setuptools.packages.find]
include = ["leadhunter*"]

[tool.setuptools.package-data]
leadhunter = ["miniapp/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
